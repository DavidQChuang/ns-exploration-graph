name: Go and PostgreSQL conformance
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exploration_graph_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GRAPH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/exploration_graph_test?sslmode=disable
      GRAPH_REQUIRE_POSTGRES: '1'
      GRAPH_REQUIRE_PYTHON: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Contract drift: spec/tool-contracts.json and toolkit/contracts.json must equal the
      # generator output (inputs frozen, result schemas derived from spec/snapshot.schema.json).
      - run: python toolkit/generate_contracts.py --check
      - run: go vet ./...
      # Includes, with PostgreSQL and Python required (no skips): JSON Schema validation with
      # uuid/uri/date-time format assertions (toolkit, spec), real tool results against the
      # result schemas, the stdio subprocess MCP tests, and the Python second consumer.
      - run: go test -race -count=1 ./...
      - name: Stdio MCP and Python consumer (explicit, verbose)
        run: go test -count=1 -v -run 'Stdio|PythonStdio' ./cmd/graph-mcp ./examples/scripted
      - name: Reachable vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...
