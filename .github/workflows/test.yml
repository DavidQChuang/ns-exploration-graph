name: Go and PostgreSQL conformance
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25.0', '1.27.3']
    services:
      postgres:
        image: postgres:17.11@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: exploration_graph_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GRAPH_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/exploration_graph_test?sslmode=disable
      GRAPH_REQUIRE_POSTGRES: '1'
      GRAPH_REQUIRE_PYTHON: '1'
      CGO_ENABLED: '1'
      GOTOOLCHAIN: local
      GRAPH_SCAN_VULNERABILITIES: ${{ matrix.go == '1.27.3' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Shared with the clean local check: schemas and drift, vet/build/install,
      # full race suite (zero skips), stdio/Python, documented examples, and vuln scan.
      - run: bash scripts/verify-release.sh
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-go${{ matrix.go }}
          path: .local/release-evidence
          include-hidden-files: true
